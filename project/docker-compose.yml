version: "3.9"
services:
  db:
    image: postgres:15
    container_name: contenedor_coches
    environment:
      POSTGRES_USER: coches123
      POSTGRES_PASSWORD: coches123
      POSTGRES_DB: ventacoches
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.utf8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    restart: always
    networks:
      - dbnet

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_curso
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: always
    networks:
      - dbnet

volumes:
  pgdata: 

networks:
  dbnet:
    driver: bridge